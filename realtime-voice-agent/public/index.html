<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Voice Agent</title>
    <link rel="icon" href="data:,">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f3f4f6; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 450px; width: 90%; }
        h2 { margin-top: 0; color: #111827; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 2rem; }
        button { background-color: #3b82f6; color: white; border: none; padding: 14px 28px; border-radius: 9999px; font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
        button:hover { background-color: #2563eb; transform: translateY(-1px); }
        button.listening { background-color: #ef4444; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        #status { margin-top: 20px; font-weight: 500; color: #4b5563; }
        .chat-log { margin-top: 25px; text-align: left; font-size: 14px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; max-height: 150px; overflow-y: auto; }
        .user-txt { color: #3b82f6; font-weight: 600; margin-bottom: 5px; }
        .agent-txt { color: #10b981; font-weight: 600; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Zero-Delay Voice Agent</h2>
        <p>100% Free • Real-Time WebSockets • Groq LPU</p>
        <button id="talkBtn">Start Call</button>
        <div id="status">Ready to connect</div>
        
        <div class="chat-log" id="chatLog" style="display: none;"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
